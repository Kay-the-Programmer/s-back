name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Typecheck + financial invariants
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: salepilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d salepilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/salepilot
      JWT_SECRET: ci-only-secret
      DB_SSL: 'false'
      PORT: '5000'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Boot backend against the service database
        run: |
          node dist/index.js > server.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -sf http://localhost:5000/api/health > /dev/null 2>&1; then
              echo "backend up after ~$((i*2))s"
              exit 0
            fi
            sleep 2
          done
          echo "backend failed to start"
          tail -80 server.log
          exit 1

      - name: Financial invariants
        run: npm run test:financial

      - name: Server log (on failure)
        if: failure()
        run: tail -120 server.log || true
