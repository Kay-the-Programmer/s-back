# Production stack for a single cloud VM (Google Cloud Always Free e2-micro).
#   - Postgres is NOT published to the internet (internal Docker network only).
#   - The backend is only reachable through Caddy (automatic HTTPS) or
#     127.0.0.1:5000 on the VM itself for debugging.
#   - Set POSTGRES_PASSWORD and API_DOMAIN in .env (see .env.production.example).
#
#   docker compose -f docker-compose.prod.yml up -d --build

# Bounded container logs — without this the json-file driver grows without
# limit and eventually fills the VM disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  s-back-db:
    image: postgres:15-alpine
    container_name: salepilot-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: salepilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d salepilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  s-back:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salepilot-backend
    # Loopback only — for debugging on the VM (curl 127.0.0.1:5000/api/health).
    # Public traffic must come through Caddy.
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./uploads:/usr/src/app/uploads
      # Store archives written before a deletion. Never served over HTTP;
      # they hold a whole shop, customers included.
      - ./archives:/usr/src/app/archives
      - ./public/images:/usr/src/app/public/images
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@s-back-db:5432/salepilot
    depends_on:
      s-back-db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    container_name: salepilot-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - API_DOMAIN=${API_DOMAIN:?set API_DOMAIN in .env}
      # This Caddy is the only thing on the box publishing 80/443, so it also
      # fronts the CampusMarket API, which lives in its own Compose project.
      - CAMPUSMARKET_DOMAIN=${CAMPUSMARKET_DOMAIN:?set CAMPUSMARKET_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - s-back
    # `default` reaches s-back; `edge` is the shared, hand-created network that
    # reaches containers in other Compose projects on this box. Listing default
    # explicitly is required - naming any network at all replaces the implicit
    # one, and dropping it would cut this proxy off from its own backend.
    networks:
      - default
      - edge
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  # Created by hand on the box, not by Compose:
  #
  #   docker network create edge
  #
  # External so both projects attach to the same network instead of each
  # creating its own project-namespaced copy - which is the whole point.
  edge:
    external: true
