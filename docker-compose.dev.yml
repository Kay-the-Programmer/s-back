x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  s-back-db:
    image: postgres:15-alpine
    container_name: salepilot-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: salepilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d salepilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  s-back:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salepilot-backend
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/usr/src/app/uploads
      # Store archives written before a deletion. Never served over HTTP;
      # they hold a whole shop, customers included.
      - ./archives:/usr/src/app/archives
      - ./public/images:/usr/src/app/public/images
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:password@s-back-db:5432/salepilot
    depends_on:
      s-back-db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
